<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>複数配送先 送料シミュレーター</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 880px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; }
    .dest { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .dest h3 { margin: 0 0 .5rem; font-size: 1rem; }
    label { display: inline-block; font-size: .85rem; color: #555; }
    select, input { padding: .35rem; margin: .2rem .4rem .2rem 0; }
    .item-row { margin: .25rem 0; }
    button { cursor: pointer; padding: .45rem .9rem; border: 1px solid #888; border-radius: 6px; background: #f7f7f7; }
    button.primary { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
    .result { background: #f0f7ff; border: 1px solid #b3d4fc; border-radius: 8px; padding: 1rem; margin-top: 1rem; white-space: pre-wrap; font-family: monospace; }
    .total { font-size: 1.3rem; font-weight: bold; color: #2b6cb0; }
    .muted { color: #888; font-size: .8rem; }
  </style>
</head>
<body>
  <h1>複数配送先 送料シミュレーター</h1>
  <p class="muted">BigCommerce の商品（shipping_type 付き）を配送先ごとに割り当てて送料を計算します。</p>

  <div id="destinations"></div>
  <button id="addDest">+ 配送先を追加</button>
  <button id="calc" class="primary">送料を計算</button>

  <div id="result"></div>

  <script>
    const PREFECTURES = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
    let products = [];
    let destSeq = 0;

    async function loadProducts() {
      const res = await fetch('/api/products?limit=250');
      const data = await res.json();
      products = (data.products || []).filter(p => p.shippingType);
    }

    function prefOptions() {
      return PREFECTURES.map(p => `<option value="${p}">${p}</option>`).join('');
    }
    function productOptions() {
      return products.map(p => `<option value="${p.id}">${p.name}（${p.shippingType} / ¥${p.price}）</option>`).join('');
    }

    function addDestination() {
      const id = ++destSeq;
      const div = document.createElement('div');
      div.className = 'dest';
      div.dataset.id = id;
      div.innerHTML = `
        <h3>配送先 ${id}</h3>
        <label>都道府県</label>
        <select class="pref">${prefOptions()}</select>
        <div class="items"></div>
        <button class="addItem">+ 商品を追加</button>`;
      document.getElementById('destinations').appendChild(div);
      div.querySelector('.addItem').onclick = () => addItem(div.querySelector('.items'));
      addItem(div.querySelector('.items'));
    }

    function addItem(container) {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <select class="product">${productOptions()}</select>
        <label>数量</label>
        <input class="qty" type="number" value="1" min="1" style="width:4rem" />
        <button class="rm">×</button>`;
      row.querySelector('.rm').onclick = () => row.remove();
      container.appendChild(row);
    }

    function buildPayload() {
      const destinations = [];
      document.querySelectorAll('.dest').forEach(d => {
        const prefecture = d.querySelector('.pref').value;
        const items = [];
        d.querySelectorAll('.item-row').forEach(r => {
          items.push({
            productId: Number(r.querySelector('.product').value),
            quantity: Number(r.querySelector('.qty').value) || 1,
          });
        });
        destinations.push({ id: 'dest-' + d.dataset.id, prefecture, items });
      });
      return { destinations };
    }

    async function calculate() {
      const result = document.getElementById('result');
      result.className = 'result';
      result.textContent = '計算中...';
      try {
        const res = await fetch('/api/shipping-calculate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(buildPayload()),
        });
        const data = await res.json();
        if (!res.ok) { result.textContent = 'エラー: ' + (data.error || res.status); return; }
        let html = `<div class="total">合計送料: ¥${data.total.toLocaleString()}</div>\n\n`;
        data.breakdown.forEach(b => {
          html += `${b.destinationId} [${b.prefecture || b.region}] → ¥${b.shipping.toLocaleString()}\n`;
        });
        result.textContent = html;
      } catch (e) {
        result.textContent = 'リクエスト失敗: ' + e.message;
      }
    }

    document.getElementById('addDest').onclick = addDestination;
    document.getElementById('calc').onclick = calculate;

    loadProducts().then(() => {
      if (products.length === 0) {
        document.getElementById('result').textContent = 'shipping_type 付きの商品が見つかりません。';
        return;
      }
      addDestination();
    });
  </script>
</body>
</html>
